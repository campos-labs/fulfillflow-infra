name: Validate infrastructure preparation

on:
  push:
    branches: [main, feature/v1.1-autoscaling-kind]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare isolated validation environment
        shell: pwsh
        run: |
          python -m pip install uv==0.12.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python scripts/setup_validation_tools.py
          exit $LASTEXITCODE
      - name: Focused tests and static checks
        shell: pwsh
        run: |
          $env:PWSH_PATH = (Get-Command pwsh -ErrorAction Stop).Source
          uv run --frozen ruff check scripts tests k8s/prepare_rabbitmq_definitions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen ruff format --check scripts tests k8s/prepare_rabbitmq_definitions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          exit $LASTEXITCODE
      - name: Render, schema validation and Terraform mock plans
        shell: pwsh
        run: |
          uv run --frozen python scripts/validate.py --output artifacts/validation
          exit $LASTEXITCODE
      - name: Preserve static validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 7
