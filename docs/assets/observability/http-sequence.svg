<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title desc"><title id="title">Consulta saudável, falha de transporte e restauração</title><desc id="desc">200 com quatro spans; 503 com três spans e erro de transporte; 200 com quatro spans após restauração. Estado confirmado antes e depois, inconclusivo durante.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527184"/></marker></defs><rect width="1200" height="585" fill="white"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="30" fill="#183042" font-weight="600">Consulta durante uma interrupção controlada</text><text x="40" y="80" font-size="20" fill="#183042">Mesmo evento já concluído · três GETs · nenhum webhook ou escrita de negócio</text><rect x="40" y="120" width="328" height="280" rx="10" fill="#eaf4f0" stroke="#a8bdcb"/><text x="58" y="157" font-size="24" fill="#183042" font-weight="600">Antes</text><text x="58" y="207" font-size="34" fill="#183042" font-weight="600">HTTP 200</text><text x="58" y="247" font-size="25" fill="#183042">4 spans</text><text x="58" y="294" font-size="18" fill="#183042">Resultado confirmado</text><text x="58" y="324" font-size="18" fill="#183042">pela consulta pública</text><text x="58" y="354" font-size="18" fill="#183042">Tracking disponível</text><path d="M 376 228 L 424 228" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="436" y="120" width="328" height="280" rx="10" fill="#fff4e7" stroke="#a8bdcb"/><text x="454" y="157" font-size="24" fill="#183042" font-weight="600">Interrupção</text><text x="454" y="207" font-size="34" fill="#183042" font-weight="600">HTTP 503</text><text x="454" y="247" font-size="25" fill="#183042">3 spans</text><text x="454" y="294" font-size="18" fill="#183042">Estado do negócio inconclusivo</text><text x="454" y="324" font-size="18" fill="#183042">Cliente Core: transport</text><text x="454" y="354" font-size="18" fill="#183042">Sem pods / endpoints Tracking</text><path d="M 772 228 L 820 228" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="832" y="120" width="328" height="280" rx="10" fill="#eaf4f0" stroke="#a8bdcb"/><text x="850" y="157" font-size="24" fill="#183042" font-weight="600">Depois</text><text x="850" y="207" font-size="34" fill="#183042" font-weight="600">HTTP 200</text><text x="850" y="247" font-size="25" fill="#183042">4 spans</text><text x="850" y="294" font-size="18" fill="#183042">Mesmo resultado confirmado</text><text x="850" y="324" font-size="18" fill="#183042">Novo pod Ready e endpoint</text><text x="850" y="354" font-size="18" fill="#183042">Restauração pelo executor</text><text x="40" y="447" font-size="21" fill="#183042" font-weight="600">Localização sustentada pela intervenção + erro do cliente + cobertura conhecida.</text><text x="40" y="483" font-size="19" fill="#183042">Ausência de span, isoladamente, não identifica a causa nem prova ausência de processamento.</text><text x="40" y="519" font-size="19" fill="#183042">4 + 3 + 4 = 11 spans distintos. Snapshots cumulativos são filtrados pelo trace de cada fase.</text><text x="40" y="558" font-size="15" fill="#526979">Fonte: http-fault-03/{before,fault,after}, injection.json e registros de restauração</text></g></svg>
