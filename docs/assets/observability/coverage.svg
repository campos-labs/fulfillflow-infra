<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">Cobertura de correlação e HTTP</title><desc id="desc">Três mensagens por IDs e quatro spans HTTP; metadados, SQL e AMQP fora da cobertura de tracing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527184"/></marker></defs><rect width="1200" height="770" fill="white"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="30" fill="#183042" font-weight="600">Coberturas complementares</text><text x="40" y="80" font-size="20" fill="#183042">Casos de workers e consulta HTTP: evidências distintas, sem comparação de ferramentas.</text><text x="40" y="126" font-size="19" fill="#183042" font-weight="600">CORRELAÇÃO EXISTENTE  ·  mensagens ligadas por IDs</text><rect x="40" y="148" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="55" y="173" font-size="20" fill="#183042" font-weight="600">Tracking</text><text x="55" y="196" font-size="18" fill="#183042">SENT</text><path d="M 367 178 L 427 178" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="148" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="455" y="173" font-size="20" fill="#183042" font-weight="600">Core</text><text x="455" y="196" font-size="18" fill="#183042">PERSISTED</text><path d="M 767 178 L 827 178" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="148" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="855" y="173" font-size="20" fill="#183042" font-weight="600">Core</text><text x="855" y="196" font-size="18" fill="#183042">DONE</text><rect x="40" y="228" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="55" y="253" font-size="20" fill="#183042" font-weight="600">Core</text><text x="55" y="276" font-size="18" fill="#183042">SENT</text><path d="M 367 258 L 427 258" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="228" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="455" y="253" font-size="20" fill="#183042" font-weight="600">Tracking</text><text x="455" y="276" font-size="18" fill="#183042">PERSISTED</text><path d="M 767 258 L 827 258" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="228" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="855" y="253" font-size="20" fill="#183042" font-weight="600">Tracking</text><text x="855" y="276" font-size="18" fill="#183042">DONE</text><rect x="40" y="308" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="55" y="333" font-size="20" fill="#183042" font-weight="600">Core</text><text x="55" y="356" font-size="18" fill="#183042">SENT</text><path d="M 367 338 L 427 338" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="308" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="455" y="333" font-size="20" fill="#183042" font-weight="600">Notifications</text><text x="455" y="356" font-size="18" fill="#183042">PERSISTED</text><path d="M 767 338 L 827 338" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="308" width="320" height="60" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="855" y="333" font-size="20" fill="#183042" font-weight="600">Notifications</text><text x="855" y="356" font-size="18" fill="#183042">DONE</text><text x="40" y="422" font-size="19" fill="#183042">3 mensagens · 9 registros por evento · resultado público conferido separadamente</text><text x="40" y="474" font-size="19" fill="#183042" font-weight="600">OPENTELEMETRY  ·  parentela dos spans HTTP</text><text x="40" y="505" font-size="18" fill="#183042">Cada caixa abaixo representa um span; Core possui operações servidor e cliente.</text><rect x="40" y="530" width="244" height="65" rx="10" fill="#eaf4f0" stroke="#88b6a4"/><text x="55" y="556" font-size="20" fill="#183042" font-weight="600">Observador</text><text x="55" y="581" font-size="18" fill="#183042">CLIENT</text><path d="M 290 562 L 324 562" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="332" y="530" width="244" height="65" rx="10" fill="#eaf4f0" stroke="#88b6a4"/><text x="347" y="556" font-size="20" fill="#183042" font-weight="600">Core</text><text x="347" y="581" font-size="18" fill="#183042">SERVER</text><path d="M 582 562 L 616 562" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="530" width="244" height="65" rx="10" fill="#eaf4f0" stroke="#88b6a4"/><text x="639" y="556" font-size="20" fill="#183042" font-weight="600">Core</text><text x="639" y="581" font-size="18" fill="#183042">CLIENT</text><path d="M 874 562 L 908 562" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/><rect x="916" y="530" width="244" height="65" rx="10" fill="#eaf4f0" stroke="#88b6a4"/><text x="931" y="556" font-size="20" fill="#183042" font-weight="600">Tracking</text><text x="931" y="581" font-size="18" fill="#183042">SERVER</text><path d="M 1040 602 L 1040 650 L 930 650" fill="none" stroke="#8c7255" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="400" y="615" width="520" height="70" rx="10" fill="#fbf4eb" stroke="#b49b7d"/><text x="418" y="642" font-size="20" fill="#775432" font-weight="600">Core: consulta de metadados</text><text x="418" y="670" font-size="18" fill="#775432">Operação adicional sem spans nesta fatia</text><text x="40" y="714" font-size="19" fill="#183042">Sem tracing de workers, AMQP ou SQL. Ligações não representam duração.</text><text x="40" y="745" font-size="15" fill="#526979">Fontes: records/healthy-01/worker-records.json e http-05/trace-records.json</text></g></svg>
