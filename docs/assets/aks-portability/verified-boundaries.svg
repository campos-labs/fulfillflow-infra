<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Portabilidade AKS e correlação HTTP</title><desc id="desc">Resumo das verificações e quatro spans da consulta saudável isolada.</desc><rect width="1200" height="700" fill="white"/><g font-family="Arial, sans-serif" fill="#183042"><text x="35" y="48" font-size="30">Portabilidade verificada em AKS</text><text x="35" y="82" font-size="18">Um evento sintético; verificações complementares, sem comparação de desempenho</text><rect x="35" y="120" width="350" height="210" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="51" y="155" font-size="22">Aplicação 9e3a135</text><text x="51" y="195" font-size="17">Admissão e duplicata verificadas</text><text x="51" y="225" font-size="17">Order / Tracking concluídos</text><text x="51" y="255" font-size="17">Notifications: simulação</text><text x="51" y="285" font-size="17">Sem nova carga nas continuações</text><rect x="425" y="120" width="350" height="210" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="441" y="155" font-size="22">Ambiente gerenciado</text><text x="441" y="195" font-size="17">2 nós · Kubernetes 1.34.11</text><text x="441" y="225" font-size="17">Azure Disk: 32 Gi + 16 Gi</text><text x="441" y="255" font-size="17">Mesmo volume e resultado</text><text x="441" y="285" font-size="17">Rede: permitido → negado → permitido</text><rect x="815" y="120" width="350" height="210" rx="10" fill="#edf3f7" stroke="#a8bdcb"/><text x="831" y="155" font-size="22">Fatia HTTP 045e1ca</text><text x="831" y="195" font-size="17">Workers suspensos sem pendências</text><text x="831" y="225" font-size="17">Uma consulta: HTTP 200</text><text x="831" y="255" font-size="17">4 spans; parentage verificado</text><text x="831" y="285" font-size="17">Workers restaurados ao final</text><text x="35" y="385" font-size="23">Correlação capturada na consulta saudável</text><rect x="35" y="415" width="255" height="90" rx="8" fill="#e9f4ed" stroke="#99bba8"/><text x="50" y="450" font-size="21">Observador</text><text x="50" y="481" font-size="18">173.16 ms · span</text><text x="297" y="469" font-size="24">→</text><rect x="330" y="415" width="255" height="90" rx="8" fill="#e9f4ed" stroke="#99bba8"/><text x="345" y="450" font-size="21">Core servidor</text><text x="345" y="481" font-size="18">80.81 ms · span</text><text x="592" y="469" font-size="24">→</text><rect x="625" y="415" width="255" height="90" rx="8" fill="#e9f4ed" stroke="#99bba8"/><text x="640" y="450" font-size="21">Core cliente</text><text x="640" y="481" font-size="18">62.29 ms · span</text><text x="887" y="469" font-size="24">→</text><rect x="920" y="415" width="255" height="90" rx="8" fill="#e9f4ed" stroke="#99bba8"/><text x="935" y="450" font-size="21">Tracking servidor</text><text x="935" y="481" font-size="18">52.60 ms · span</text><text x="35" y="550" font-size="18">Setas representam parentage; durações aninhadas não são parcelas somáveis.</text><text x="35" y="580" font-size="18">Tracking → Core (metadados), SQL, AMQP e workers não têm spans nesta captura.</text><text x="35" y="630" font-size="20">Encerramento: AKS e execução removidos; ACR/state temporariamente retidos.</text><text x="35" y="662" font-size="17">Fontes: seleções JSON versionadas; inventário corresponde ao instante de encerramento.</text></g></svg>
