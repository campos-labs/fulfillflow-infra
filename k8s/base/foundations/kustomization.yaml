apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fulfillflow
resources:
- namespace.yaml
- storage.yaml
- postgres.yaml
- rabbitmq.yaml
- network-policies.yaml
configMapGenerator:
- name: postgres-init
  files:
  - assets/10-services.sh
  - assets/30-notifications.sh
- name: rabbitmq-config
  files:
  - assets/rabbitmq.conf
