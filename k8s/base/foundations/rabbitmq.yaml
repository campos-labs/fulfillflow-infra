apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: fulfillflow
  annotations:
    fulfillflow.io/application-source: 9e3a135a00db218643633c7165d3106f0c8285e1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: fulfillflow
  ports:
  - name: amqp
    port: 5672
    targetPort: amqp
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: fulfillflow
  annotations:
    fulfillflow.io/application-source: 9e3a135a00db218643633c7165d3106f0c8285e1
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/part-of: fulfillflow
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: fulfillflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: rabbitmq
        image: rabbitmq:4.2.4-alpine@sha256:d1b24a78c1ace826771eb8585d8f30315a64f1aad4d1fe6fcd9b4435cccc16f4
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: amqp
          containerPort: 5672
        env:
        - name: RABBITMQ_NODENAME
          value: rabbit@rabbitmq-0
        - name: RABBITMQ_USE_LONGNAME
          value: 'false'
        - name: RABBITMQ_CTL_ERL_ARGS
          value: +S 1:1 +A 1
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
          readOnly: true
        - name: definitions
          mountPath: /etc/rabbitmq/definitions
          readOnly: true
        startupProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_running
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_running
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
      - name: config
        configMap:
          name: rabbitmq-config
      - name: definitions
        secret:
          secretName: rabbitmq-definitions
          optional: false
          defaultMode: 288
          items:
          - key: definitions.json
            path: definitions.json
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fulfillflow-retain
      resources:
        requests:
          storage: 16Gi
