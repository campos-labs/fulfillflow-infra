apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../example/migrations
commonAnnotations:
  fulfillflow.io/resource-profile: reduced-functional-unverified
patches:
- target:
    kind: Job
  patch: '[{"op": "replace", "path": "/spec/template/spec/containers/0/resources/requests/cpu",
    "value": "250m"}]'
