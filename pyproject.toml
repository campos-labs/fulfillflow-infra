[project]
name = "fulfillflow-infra-validation"
version = "0.1.0"
description = "Offline validation tooling for FulfillFlow infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.2", "jsonschema==4.25.1"]

[dependency-groups]
dev = ["ruff==0.12.12"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
